process_name: hollow_knight.exe
player_info:
  module_base: UnityPlayer.dll
  base_offset: 0x01F28838
  offsets: [0x0, 0x0, 0x10, 0x18, 0x0, 0x60]
  hp_offset: 0x198
  max_hp_offset: 0x19C
  soul_offset: 0x1D4
  max_hp: 9 # 神居档的最大血量为9，目前本项目只考虑神居。提前设置好最大血量，用于检验通过内存读取到的最大血量是否正确
  hp_value_type: 当前仅int32，无需调整。
player_position:
  module_base: UnityPlayer.dll
  base_offset: 0x01F4FD90
  offsets: [0x48, 0x370, 0x10]
  x_offset: 0x22C
  y_offset: 0x230
  z_offset: 0x234
boss_info:
  GG_Hornet_1:
keybinds:
  left: a
  right: d
  up: w
  down: s
  jump: space
  attack: j
  dash: lshift
  super_dash: h
  dream_knife: f
  heal: l
  skill: k
  esc: esc
menu:
  quit_to_title:
    event:
      - {key: esc, action: tap, duration: 0.0, delay: 1.0}
      - {key: up, action: tap, duration: 0.0, delay: 0.0}
      - {key: jump, action: tap, duration: 0.0, delay: 1.0}
      - {key: up, action: tap, duration: 0.0, delay: 0.0}
      - {key: jump, action: tap, duration: 0.0, delay: 5.0}
  reload_save:
    event:
      - {key: up, action: tap, duration: 0.0, delay: 0.0}
      - {key: down, action: tap, duration: 0.0, delay: 0.0}
      - {key: jump, action: tap, duration: 0.0, delay: 2.0}
      - {key: jump, action: tap, duration: 0.0, delay: 7.0}
  godhome_boss_room:
    GG_Hornet_1:
      event:
        - {key: jump, action: tap, duration: 0.0, delay: 1.2}
        - {key: right, action: hold, duration: 0.8, delay: 1.4}
        - {key: right, action: hold, duration: 5.8, delay: 0.0}
collect:
  sample_hz: 60
  countdown_s: 5
  boss: GG_Hornet_1
  max_episode_s: 300          # 单局最长秒数 → end_reason=timeout
  max_hp_read_fail: 30        # 连续 hp 读失败帧数上限 → discard
  max_focus_lost: 120         # 连续失焦帧数上限 → discard
  max_dropped: 100            # 追帧累计丢帧上限 → discard
