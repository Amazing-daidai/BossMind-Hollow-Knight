window_title: Hollow Knight
process_name: hollow_knight.exe
player_facing:
  right_value: -1.0
  left_value: 1.0
game_state:
  playing_value: 4
  paused_value: 5
  cutscene_value: 3
keybinds:
  left: a
  right: d
  up: w
  down: s
  jump: space
  attack: j
  dash: lshift
  super_dash: h
  dream_knife: f
  heal: l
  skill: k
  inventory: i
  tab: tab
  esc: esc
menu:
  quit_to_title:
    event:
      - {key: esc, action: tap, duration: 0.0, delay: 1.0}
      - {key: up, action: tap, duration: 0.0, delay: 0.0}
      - {key: jump, action: tap, duration: 0.0, delay: 1.0}
      - {key: up, action: tap, duration: 0.0, delay: 0.0}
      - {key: jump, action: tap, duration: 0.0, delay: 5.0}
  reload_save:
    event:
      - {key: up, action: tap, duration: 0.0, delay: 0.0}
      - {key: down, action: tap, duration: 0.0, delay: 0.0}
      - {key: jump, action: tap, duration: 0.0, delay: 2.0}
      - {key: jump, action: tap, duration: 0.0, delay: 7.0}
  godhome_boss_room:
    GG_Hornet_1:
      event:
        - {key: jump, action: tap, duration: 0.0, delay: 1.2}
        - {key: right, action: hold, duration: 0.8, delay: 1.4}
        - {key: right, action: hold, duration: 5.8, delay: 0.0}
collect:
  sample_hz: 60
  countdown_s: 5
  boss: GG_Hornet_1
  max_episode_s: 300          # 单局最长秒数 → end_reason=timeout
  max_focus_lost: 120         # 连续失焦帧数上限 → discard
  max_dropped: 100            # 追帧累计丢帧上限 → discard
  vision_hz: 10
  vision_region: {left: 190, top: 230, width: 1550, height: 740}
  vision_format: jpg          # jpg | png
  vision_jpeg_quality: 85
  max_image_dropped: 3        # 队列丢帧累计上限 → discard；正式批次可改为 0
client:
  UdpHost: 127.0.0.1
  UdpPort: 28765

# 神居第一门 Pantheon of the Master（战斗房 only；不含 GG_Spa / 中场）
# is_battle: PLAYING ∧ scene∈本表 ∧ enemies.name 命中任一 primary_name_substr 且该主敌 hp>0
# 双人战（钉大师）多个子串：命中任一即视为主敌，多个则取 hp 最大
# primary_name_substr 按常见 GameObject 名；B 机 Log 对不上再改子串
boss_info:
  GG_Vengefly:
    pantheon: 1
    display_name: Vengefly King
    primary_name_substr: ["Vengefly", "Buzzer"]
  GG_Gruz_Mother:
    pantheon: 1
    display_name: Gruz Mother
    primary_name_substr: ["Gruz", "Giant Fly"]
  GG_False_Knight:
    pantheon: 1
    display_name: False Knight
    primary_name_substr: ["False Knight"]
  GG_Mega_Moss_Charger:
    pantheon: 1
    display_name: Massive Moss Charger
    primary_name_substr: ["Moss Charger", "Mega Moss"]
  GG_Hornet_1:
    pantheon: 1
    display_name: Hornet Protector
    primary_name_substr: ["Hornet"]
  GG_Ghost_Gorb:
    pantheon: 1
    display_name: Gorb
    primary_name_substr: ["Gorb", "Aladar"]
  GG_Dung_Defender:
    pantheon: 1
    display_name: Dung Defender
    primary_name_substr: ["Dung Defender"]
  GG_Mage_Knight:
    pantheon: 1
    display_name: Soul Warrior
    primary_name_substr: ["Mage Knight"]
  GG_Brooding_Mawlek:
    pantheon: 1
    display_name: Brooding Mawlek
    primary_name_substr: ["Mawlek"]
  GG_Nailmasters:
    pantheon: 1
    display_name: Brothers Oro & Mato
    primary_name_substr: ["Oro", "Mato"]