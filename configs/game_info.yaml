window_title: Hollow Knight

player_facing:
  right_value: -1.0
  left_value: 1.0
game_state:
  playing_value: 4
  paused_value: 5
  cutscene_value: 3
keybinds:
  left: a
  right: d
  up: w
  down: s
  jump: space
  attack: j
  dash: lshift
  super_dash: h
  dream_knife: f
  heal: l
  skill: k
  inventory: i
  tab: tab
  esc: esc
menu:
  quit_to_title:
    event:
      - {key: esc, action: tap, duration: 0.0, delay: 1.0}
      - {key: up, action: tap, duration: 0.0, delay: 0.0}
      - {key: jump, action: tap, duration: 0.0, delay: 1.0}
      - {key: up, action: tap, duration: 0.0, delay: 0.0}
      - {key: jump, action: tap, duration: 0.0, delay: 5.0}
  reload_save:
    event:
      - {key: up, action: tap, duration: 0.0, delay: 0.0}
      - {key: down, action: tap, duration: 0.0, delay: 0.0}
      - {key: jump, action: tap, duration: 0.0, delay: 2.0}
      - {key: jump, action: tap, duration: 0.0, delay: 7.0}
  godhome_boss_room:
    GG_Hornet_1:
      event:
        - {key: jump, action: tap, duration: 0.0, delay: 1.2}
        - {key: right, action: hold, duration: 0.8, delay: 1.4}
        - {key: right, action: hold, duration: 5.8, delay: 0.0}
collect:
  sample_hz: 60
  countdown_s: 5
  boss: GG_Hornet_1
  max_episode_s: 300          # 单局最长秒数 → end_reason=timeout
  max_hp_read_fail: 30        # 连续 hp 读失败帧数上限 → discard
  max_focus_lost: 120         # 连续失焦帧数上限 → discard
  max_dropped: 100            # 追帧累计丢帧上限 → discard
  vision_hz: 10
  vision_region: {left: 190, top: 230, width: 1550, height: 740}
  vision_format: jpg          # jpg | png
  vision_jpeg_quality: 85
  max_image_dropped: 3        # 队列丢帧累计上限 → discard；正式批次可改为 0
client:
  UdpHost: 127.0.0.1
  UdpPort: 28765