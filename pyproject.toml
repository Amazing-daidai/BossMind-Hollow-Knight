[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bossmind"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0.1,<7",
    "pymem>=1.13,<2",
]

[project.optional-dependencies]
# B 机：键盘钩子 + 按键注入
collect = [
    "pydirectinput>=1.0.4,<2",
    "pynput>=1.8.2,<2",
]
# Phase 2+ 截屏 / ROI
perception = [
    "mss>=9.0.1,<11",
    "Pillow>=10.2,<12",
    "opencv-python-headless>=4.9,<5",
]
# 数据集构建 / Parquet
data = [
    "pandas>=2.2,<3",
    "pyarrow>=15.0,<20",
]
# 局内推理 / 模型导出
inference = [
    "onnx>=1.16,<2",
    "onnxruntime>=1.17,<2",
]
# WSL 训练 BC / CNN（不含 PyTorch，见 requirements.txt 注释）
train = [
    "scikit-learn>=1.4,<2",
    "tensorboard>=2.16,<3",
    "tqdm>=4.66,<5",
]
# Phase 3+ LLM Agent
llm = [
    "openai>=1.40,<2",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP015", "I001"]  # UP015: 允许 open(..., "r"); I001: 不强制 import 排序

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
